name: Claude Bridge CI

on:
  workflow_call:
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "bridges/appserver-kit/**"
      - "bridges/claude/**"
      - "bridges/claude-sdk/**"
      - "bridges/agy-acp/**"
      - "scripts/check-claude-sdk-adapter.sh"
      - "scripts/check-agy-acp-adapter.sh"
      - "scripts/test-claude-adapter-windows.ps1"
      - ".github/workflows/claude-bridge-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: claude-bridge-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Toolchain
        id: toolchain
        shell: bash
        run: |
          rustc --version
          cargo --version
          rustc_key="$(rustc --version | tr ' ()' '---')"
          echo "rustc_key=$rustc_key" >> "$GITHUB_OUTPUT"

      - name: Cache Cargo registry and build target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-bridge-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.rustc_key }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-bridge-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.rustc_key }}-

      - name: Format
        run: cargo fmt --all -- --check

      - name: Test Claude bridge workspace
        shell: bash
        run: |
          cargo test --locked \
            -p alleycat-codex-proto \
            -p alleycat-bridge-core \
            -p alleycat-claude-bridge

  sdk-adapter:
    # 基于 Claude Agent SDK 的新适配器（#655）；与 Rust bridge 同属 Claude 通道。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: bridges/claude-sdk/.bun-version

      - name: Cache Bun install cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-sdk-adapters-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bridges/claude-sdk/.bun-version', 'bridges/claude-sdk/bun.lock', 'bridges/agy-acp/.bun-version', 'bridges/agy-acp/bun.lock') }}
          restore-keys: |
            bun-sdk-adapters-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Typecheck and test SDK adapter
        run: |
          bash ./scripts/check-claude-sdk-adapter.sh
          bash ./scripts/check-agy-acp-adapter.sh

      - name: Cross-compile packaged adapter targets
        # 与 Mac App、Windows 安装包里的目标一致（#660），先在这里确认都能编出来。
        run: |
          for target in bun-darwin-arm64 bun-darwin-x64 bun-windows-x64-baseline; do
            (cd bridges/claude-sdk && bun build --compile --minify --target="$target" src/main.ts --outfile "$RUNNER_TEMP/claude-adapter-$target")
            (cd bridges/agy-acp && bun build --compile --minify --target="$target" src/main.ts --outfile "$RUNNER_TEMP/agy-adapter-$target")
          done

  sdk-adapter-windows:
    # Windows 上 agentd 用 --tcp-listen 启动适配器（#660）：编出与安装包相同的可执行文件并实际启动。
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Read Bun version
        id: bun-version
        shell: pwsh
        run: '"version=$((Get-Content bridges/claude-sdk/.bun-version -Raw).Trim())" >> $env:GITHUB_OUTPUT'

      - name: Setup Bun (baseline)
        # Bun 1.2.22 在 Windows 上交叉下载 baseline 运行时后解压失败；直接安装 baseline 版，
        # 编译目标与它自己相同，不再下载。版本仍来自 .bun-version（#660）。
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-download-url: https://github.com/oven-sh/bun/releases/download/bun-v${{ steps.bun-version.outputs.version }}/bun-windows-x64-baseline.zip

      - name: Cache Bun install cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-claude-sdk-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bridges/claude-sdk/.bun-version', 'bridges/claude-sdk/bun.lock') }}
          restore-keys: |
            bun-claude-sdk-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Build Windows adapter
        shell: pwsh
        working-directory: bridges/claude-sdk
        run: |
          bun install --frozen-lockfile --omit optional
          if ($LASTEXITCODE -ne 0) { throw 'bun install failed.' }
          bun build --compile --minify --target=bun-windows-x64-baseline src/main.ts --outfile "$env:RUNNER_TEMP\mimi-claude-adapter.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Claude adapter build failed.' }

      - name: Smoke test over loopback TCP
        shell: pwsh
        run: ./scripts/test-claude-adapter-windows.ps1 -AdapterPath "$env:RUNNER_TEMP\mimi-claude-adapter.exe"
