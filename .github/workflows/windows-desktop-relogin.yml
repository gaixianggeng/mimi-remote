name: Windows desktop relogin acceptance

on:
  push:
    branches: [codex/gh-979-relogin-acceptance]

permissions:
  contents: read
  actions: read

jobs:
  desktop:
    if: github.repository == 'gaixianggeng/mimi-remote'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        include:
          - desktop: Windows 10 22H2
            build: '19045'
            iso_url: https://software-static.download.prss.microsoft.com/dbazure/988969d5-f34g-4e03-ac9d-1f9786c66750/19045.2006.220908-0225.22h2_release_svc_refresh_CLIENTENTERPRISEEVAL_OEMRET_x64FRE_en-us.iso
            iso_sha256: ef7312733a9f5d7d51cfa04ac497671995674ca5e1058d5164d6028f0938d668
    name: ${{ matrix.desktop }} x64
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned-windows-desktop-test-fixture
          path: ${{ runner.temp }}/desktop-relogin
          # The installer job in this run built the same product tree as #1048.
          run-id: 44346423333
          github-token: ${{ github.token }}
      - name: Run real desktop sign-out and sign-in inside the isolated guest
        env:
          ISO_URL: ${{ matrix.iso_url }}
          ISO_SHA256: ${{ matrix.iso_sha256 }}
          EXPECTED_WIN_BUILD: ${{ matrix.build }}
        run: bash ./scripts/test-windows-desktop-relogin.sh
