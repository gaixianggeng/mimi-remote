name: Windows desktop relogin acceptance

on:
  push:
    branches: [codex/gh-979-relogin-acceptance]

permissions:
  contents: read

jobs:
  installer:
    if: github.repository == 'gaixianggeng/mimi-remote'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: windows/global.json
      - name: Read Bun version
        id: bun
        shell: pwsh
        run: '"version=$((Get-Content bridges/claude-sdk/.bun-version-windows -Raw).Trim())" >> $env:GITHUB_OUTPUT'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-download-url: https://github.com/oven-sh/bun/releases/download/bun-v${{ steps.bun.outputs.version }}/bun-windows-x64-baseline.zip
      - name: Build the unsigned desktop-acceptance installer
        shell: pwsh
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Requires a GitHub-hosted runner.' }
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          $env:MIMI_DOTNET_ARTIFACTS = Join-Path $env:RUNNER_TEMP 'dotnet'
          $output = Join-Path $env:RUNNER_TEMP 'desktop-relogin'
          ./scripts/build-windows-installer.ps1 -Version 1.1.15-acceptance -OutputDirectory $output -AllowUnsignedRelease
          ./scripts/check-windows-installer.ps1 -InstallerPath (Join-Path $output 'Mimi-Remote-Setup-1.1.15-acceptance-unsigned.exe') -ExpectedVersion 1.1.15-acceptance
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-windows-desktop-test-fixture
          path: ${{ runner.temp }}/desktop-relogin/
          retention-days: 1
          if-no-files-found: error

  desktop:
    if: github.repository == 'gaixianggeng/mimi-remote'
    needs: installer
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        include:
          - desktop: Windows 10 22H2
            build: '19045'
            iso_url: https://software-static.download.prss.microsoft.com/dbazure/988969d5-f34g-4e03-ac9d-1f9786c66750/19045.2006.220908-0225.22h2_release_svc_refresh_CLIENTENTERPRISEEVAL_OEMRET_x64FRE_en-us.iso
            iso_sha256: ef7312733a9f5d7d51cfa04ac497671995674ca5e1058d5164d6028f0938d668
          - desktop: Windows 11 26H2
            build: '26300'
            iso_url: https://software-static.download.prss.microsoft.com/dbazure/26300.9457.260913-1737.26h2_ge_release_svc_refresh_CLIENTENTERPRISEEVAL_OEMRET_x64FRE_en-us.iso
            iso_sha256: bc3f24086ebadc94489066b5ad78089e2cf5c3491e90e790bb81a2b199c10e38
    name: ${{ matrix.desktop }} x64
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned-windows-desktop-test-fixture
          path: ${{ runner.temp }}/desktop-relogin
      - name: Run real desktop sign-out and sign-in inside the isolated guest
        env:
          ISO_URL: ${{ matrix.iso_url }}
          ISO_SHA256: ${{ matrix.iso_sha256 }}
          EXPECTED_WIN_BUILD: ${{ matrix.build }}
        run: bash ./scripts/test-windows-desktop-relogin.sh
