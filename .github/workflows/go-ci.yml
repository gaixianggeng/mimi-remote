name: Go CI

on:
  workflow_call:
  push:
    branches:
      - main
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "contracts/mimi-protocol/**"
      - ".goreleaser.yml"
      - "packaging/**"
      - "scripts/check-packaging.sh"
      - "scripts/check-critical-regressions.sh"
      - "scripts/test-conversation-regressions.sh"
      - "scripts/check-macos-release-signing.sh"
      - "scripts/check-release-artifacts.sh"
      - "scripts/check-release-source.sh"
      - "scripts/check-source-size.sh"
      - "scripts/check-mimi-protocol-contract.sh"
      - "scripts/install-linux.sh"
      - "scripts/test-install-linux.sh"
      - "scripts/build-windows-installer.ps1"
      - "scripts/check-windows-installer.ps1"
      - "scripts/test-windows-install.ps1"
      - "scripts/sign-agentd-dev-macos.sh"
      - "scripts/restart-agentd-dev-macos.sh"
      - "scripts/restart-agentd-dev-handoff-macos.sh"
      - "scripts/verify-release.sh"
      - "scripts/check-nightly-release.sh"
      - "scripts/generate-nightly-what-to-test.rb"
      - "scripts/check-pr-gate.sh"
      - "scripts/ci-pr-scope.sh"
      - ".github/workflows/go-ci.yml"
      - ".github/workflows/nightly.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check packaging sources
        run: bash ./scripts/check-packaging.sh

      - name: Check Mimi protocol contract
        run: bash ./scripts/check-mimi-protocol-contract.sh

      - name: Check formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"

      - name: Check source size
        run: bash ./scripts/check-source-size.sh

      - name: Check module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Build release binary
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w -X main.version=ci" -o "$RUNNER_TEMP/agentd" ./cmd/agentd

      - name: Check GoReleaser config
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: "v2.15.3"
          args: check

  verify-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: pwsh
        run: |
          $unformatted = gofmt -l (git ls-files '*.go')
          if ($unformatted) { throw "Unformatted Go files:`n$($unformatted -join "`n")" }

      - name: Check Mimi protocol contract
        shell: bash
        run: bash ./scripts/check-mimi-protocol-contract.sh

      - name: Check module files
        shell: pwsh
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet and test
        shell: pwsh
        run: |
          go vet ./...
          go test ./... -count=1

      - name: Build Windows binaries
        shell: pwsh
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=ci" -o "$env:RUNNER_TEMP\agentd.exe" ./cmd/agentd
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o "$env:RUNNER_TEMP\mimi-remote-tray.exe" ./cmd/mimi-remote-tray

      - name: Check Windows packaging policy
        shell: pwsh
        run: ./scripts/test-windows-install.ps1
