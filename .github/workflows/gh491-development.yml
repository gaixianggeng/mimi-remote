name: GH491 implementation checks

on:
  push:
    branches: [codex/gh-491-module-management-impl]
    paths: [.github/workflows/gh491-development.yml]

permissions:
  contents: read

jobs:
  regression:
    if: github.repository == 'gaixianggeng/mimi-remote'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true
      - name: Affected Go package regression
        run: go test -count=1 -timeout=240s ./internal/networkaccess ./internal/config ./internal/setup ./internal/doctor ./internal/httpapi ./cmd/agentd
      - name: Type-check Mac application and tests
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/gh491-swift-module"
          mkdir -p "$output"
          sdk=$(xcrun --sdk macosx --show-sdk-path)
          platform=$(xcrun --sdk macosx --show-sdk-platform-path)
          target="$(uname -m)-apple-macos15.0"
          xcrun swiftc -parse-as-library -emit-module -enable-testing -D DEBUG -swift-version 5 \
            -target "$target" -sdk "$sdk" -module-name MimiRemoteMac \
            -emit-module-path "$output/MimiRemoteMac.swiftmodule" \
            $(find macos/MimiRemoteMac/Sources -name '*.swift' | sort)
          xcrun swiftc -typecheck -parse-as-library -D DEBUG -swift-version 5 \
            -target "$target" -sdk "$sdk" -I "$output" \
            -F "$platform/Developer/Library/Frameworks" \
            -I "$platform/Developer/usr/lib" \
            $(find macos/MimiRemoteMac/Tests -name '*.swift' | sort)
