name: Release

on:
  repository_dispatch:
    types:
      - release

permissions:
  contents: read

concurrency:
  group: mimi-remote-release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.client_payload.release_tag }}

jobs:
  source-trust:
    name: Verify release source
    if: github.repository == 'gaixianggeng/mimi-remote'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      tag_sha: ${{ steps.source.outputs.tag_sha }}
    steps:
      - name: Checkout trusted main source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      # 这个 job 不读取任何 Secret；来源不可信时，签名与写 Release 的 job 都不会启动。
      - name: Trust gate before release secrets
        id: source
        run: bash ./scripts/check-release-source.sh --check

  verify:
    needs: source-trust
    if: github.repository == 'gaixianggeng/mimi-remote'
    runs-on: macos-26
    timeout-minutes: 30
    environment: production-release
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.source-trust.outputs.tag_sha }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install universal macOS Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install repository safety tools
        run: command -v rg >/dev/null 2>&1 || brew install ripgrep

      - name: Check packaging sources
        run: bash ./scripts/check-packaging.sh

      - name: Build Codex Skill package
        run: bash ./scripts/package-skill.sh dist-skill

      - name: Verify public release prerequisites
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: bash ./scripts/check-release-prerequisites.sh

      - name: Verify macOS signing prerequisites
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: bash ./scripts/check-macos-release-signing.sh

      - name: Check public repository safety
        run: bash ./scripts/check-public-repo-safety.sh

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Test
        run: |
          go vet ./...
          go test ./... -count=1

      - name: Build Mac installer snapshot
        run: |
          bash ./scripts/build-macos-installer.sh \
            --snapshot \
            --version "${RELEASE_TAG#v}" \
            --build-number "$GITHUB_RUN_NUMBER" \
            --output-dir dist-macos

      - name: Check Mac installer snapshot
        run: bash ./scripts/check-macos-installer.sh dist-macos/Mimi-Remote-Mac.dmg

      - name: Build release snapshot
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: "v2.15.3"
          args: release --snapshot --clean --skip=publish
        env:
          GOTOOLCHAIN: local
          GORELEASER_CURRENT_TAG: ${{ env.RELEASE_TAG }}
          TAP_DEPLOY_KEY: snapshot-only-not-used

      - name: Check release artifacts
        run: bash ./scripts/check-release-artifacts.sh

  verify-windows:
    needs: source-trust
    if: github.repository == 'gaixianggeng/mimi-remote'
    runs-on: windows-latest
    timeout-minutes: 35
    environment: production-release
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.source-trust.outputs.tag_sha }}

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build and verify Windows installer
        shell: pwsh
        env:
          WINDOWS_SIGN_PFX: ${{ secrets.WINDOWS_SIGN_PFX }}
          WINDOWS_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
        run: |
          $hasPfx = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGN_PFX)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGN_PFX_PASSWORD)
          if ($hasPfx -ne $hasPassword) {
            throw 'WINDOWS_SIGN_PFX and WINDOWS_SIGN_PFX_PASSWORD must either both be configured or both be absent.'
          }
          $pfx = $null
          try {
            if ($hasPfx) {
              $pfx = Join-Path $env:RUNNER_TEMP 'mimi-remote-signing.pfx'
              [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SIGN_PFX))
              ./scripts/build-windows-installer.ps1 `
                -Version ($env:RELEASE_TAG).TrimStart('v') `
                -OutputDirectory dist-windows `
                -PfxPath $pfx `
                -PfxPassword $env:WINDOWS_SIGN_PFX_PASSWORD
            } else {
              Write-Warning 'Windows signing secrets are absent. Publishing an unsigned installer that may trigger Microsoft Defender SmartScreen.'
              ./scripts/build-windows-installer.ps1 `
                -Version ($env:RELEASE_TAG).TrimStart('v') `
                -OutputDirectory dist-windows `
                -AllowUnsignedRelease
            }
            $installer = Get-Item "dist-windows\Mimi-Remote-Setup-*.exe"
            if ($hasPfx) {
              ./scripts/check-windows-installer.ps1 -InstallerPath $installer.FullName -RequireSignature
              'Windows installer signing: Authenticode PFX (Valid).' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            } else {
              ./scripts/check-windows-installer.ps1 -InstallerPath $installer.FullName
              'Windows installer signing: unsigned-release. Verify SHA-256 before running; SmartScreen may warn.' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            }
          } finally {
            if ($pfx) {
              Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Upload verified Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mimi-remote-windows-installer
          path: dist-windows/
          if-no-files-found: error

  release:
    needs:
      - source-trust
      - verify
      - verify-windows
    if: github.repository == 'gaixianggeng/mimi-remote'
    runs-on: macos-26
    timeout-minutes: 45
    environment: production-release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.source-trust.outputs.tag_sha }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install universal macOS Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build Codex Skill package
        run: bash ./scripts/package-skill.sh dist-skill

      - name: Build, sign, and notarize Mac installer
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          bash ./scripts/build-macos-installer.sh \
            --version "${RELEASE_TAG#v}" \
            --build-number "$GITHUB_RUN_NUMBER" \
            --output-dir dist-macos

      - name: Check signed Mac installer
        run: bash ./scripts/check-macos-installer.sh --require-notarization dist-macos/Mimi-Remote-Mac.dmg

      - name: Release
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: "v2.15.3"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ env.RELEASE_TAG }}
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
          GOTOOLCHAIN: local
          MIMI_MACOS_SIGNING: required
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}

      - name: Upload Mac installer to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            dist-macos/Mimi-Remote-Mac.dmg \
            dist-macos/Mimi-Remote-Mac.dmg.sha256 \
            dist-skill/install-mimi-remote.zip \
            dist-skill/install-mimi-remote.zip.sha256 \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

      - name: Check published release artifacts
        env:
          MIMI_REQUIRE_MACOS_SIGNATURE: "1"
        run: bash ./scripts/check-release-artifacts.sh

  publish-windows:
    needs:
      - source-trust
      - release
      - verify-windows
    if: github.repository == 'gaixianggeng/mimi-remote'
    runs-on: windows-latest
    timeout-minutes: 10
    environment: production-release
    permissions:
      contents: write
    steps:
      - name: Download verified Windows installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mimi-remote-windows-installer
          path: dist-windows

      - name: Upload Windows installer to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem -LiteralPath dist-windows -File
          gh release upload $env:RELEASE_TAG $files.FullName --clobber --repo $env:GITHUB_REPOSITORY
