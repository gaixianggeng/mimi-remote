name: Release

on:
  repository_dispatch:
    types:
      - release

permissions:
  contents: read

concurrency:
  group: mimi-remote-release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.client_payload.release_tag }}

jobs:
  source-trust:
    name: Verify release source
    if: github.repository == 'gaixianggeng/mimi-remote'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      tag_sha: ${{ steps.source.outputs.tag_sha }}
    steps:
      - name: Checkout trusted main source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      # 这个 job 不读取任何 Secret；来源不可信时，签名与写 Release 的 job 都不会启动。
      - name: Trust gate before release secrets
        id: source
        run: bash ./scripts/check-release-source.sh --check

  verify-safety:
    name: Verify full-history repository safety
    needs: source-trust
    if: github.repository == 'gaixianggeng/mimi-remote'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout verified release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.source-trust.outputs.tag_sha }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install repository safety tools
        run: command -v rg >/dev/null 2>&1 || sudo apt-get install -y ripgrep

      - name: Check public repository safety
        run: bash ./scripts/check-public-repo-safety.sh --full-history

  verify:
    needs:
      - source-trust
      - verify-safety
    if: github.repository == 'gaixianggeng/mimi-remote'
    runs-on: macos-26
    timeout-minutes: 40
    environment: production-release
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.source-trust.outputs.tag_sha }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install universal macOS Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Setup Bun
        # 安装包内嵌的 Claude 适配器用 Bun 编译，版本固定为 .bun-version（#660）。
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: bridges/claude-sdk/.bun-version

      - name: Install repository safety tools
        run: command -v rg >/dev/null 2>&1 || brew install ripgrep

      - name: Check packaging sources
        run: bash ./scripts/check-packaging.sh

      - name: Build Codex Skill package
        run: bash ./scripts/package-skill.sh dist-skill

      - name: Verify public release prerequisites
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: bash ./scripts/check-release-prerequisites.sh

      - name: Verify macOS signing prerequisites
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: bash ./scripts/check-macos-release-signing.sh

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Test
        run: |
          go vet ./...
          go test ./... -count=1

      - name: Build Mac installer snapshot
        run: |
          bash ./scripts/build-macos-installer.sh \
            --snapshot \
            --version "${RELEASE_TAG#v}" \
            --build-number "$GITHUB_RUN_NUMBER" \
            --output-dir dist-macos

      - name: Check Mac installer snapshot
        run: bash ./scripts/check-macos-installer.sh dist-macos/Mimi-Remote-Mac.dmg

      - name: Build release snapshot
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: "v2.15.3"
          args: release --snapshot --clean --skip=publish
        env:
          GOTOOLCHAIN: local
          GORELEASER_CURRENT_TAG: ${{ env.RELEASE_TAG }}
          TAP_DEPLOY_KEY: snapshot-only-not-used

      - name: Check release artifacts
        run: bash ./scripts/check-release-artifacts.sh

  verify-windows:
    needs:
      - source-trust
      - verify-safety
    if: github.repository == 'gaixianggeng/mimi-remote'
    runs-on: windows-latest
    timeout-minutes: 35
    environment: production-release
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.source-trust.outputs.tag_sha }}

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup .NET
        # A release retry can target an older trusted tag without the Windows host project.
        if: ${{ hashFiles('windows/global.json') != '' }}
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: windows/global.json

      - name: Read Bun version
        id: bun-version
        shell: pwsh
        run: '"version=$((Get-Content bridges/claude-sdk/.bun-version -Raw).Trim())" >> $env:GITHUB_OUTPUT'

      - name: Setup Bun (baseline)
        # Bun 1.2.22 在 Windows 上交叉下载 baseline 运行时后解压失败；直接安装 baseline 版，
        # 编译目标与它自己相同，不再下载。版本仍来自 .bun-version（#660）。
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-download-url: https://github.com/oven-sh/bun/releases/download/bun-v${{ steps.bun-version.outputs.version }}/bun-windows-x64-baseline.zip

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build and verify Windows installer
        shell: pwsh
        env:
          WINDOWS_SIGN_PFX: ${{ secrets.WINDOWS_SIGN_PFX }}
          WINDOWS_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
        run: |
          $hasPfx = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGN_PFX)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGN_PFX_PASSWORD)
          if ($hasPfx -ne $hasPassword) {
            throw 'WINDOWS_SIGN_PFX and WINDOWS_SIGN_PFX_PASSWORD must either both be configured or both be absent.'
          }
          $pfx = $null
          try {
            if ($hasPfx) {
              $pfx = Join-Path $env:RUNNER_TEMP 'mimi-remote-signing.pfx'
              [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SIGN_PFX))
              ./scripts/build-windows-installer.ps1 `
                -Version ($env:RELEASE_TAG).TrimStart('v') `
                -OutputDirectory dist-windows `
                -PfxPath $pfx `
                -PfxPassword $env:WINDOWS_SIGN_PFX_PASSWORD
            } else {
              Write-Warning 'Windows signing secrets are absent. Building an unsigned compatibility-check installer for the private Actions artifact.'
              ./scripts/build-windows-installer.ps1 `
                -Version ($env:RELEASE_TAG).TrimStart('v') `
                -OutputDirectory dist-windows `
                -AllowUnsignedRelease
            }
            $installer = Get-Item "dist-windows\Mimi-Remote-Setup-*.exe"
            if ($hasPfx) {
              ./scripts/check-windows-installer.ps1 -InstallerPath $installer.FullName -ExpectedVersion $env:RELEASE_TAG -RequireSignature
              'Windows installer signing: Authenticode PFX (Valid).' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            } else {
              ./scripts/check-windows-installer.ps1 -InstallerPath $installer.FullName -ExpectedVersion $env:RELEASE_TAG
              'Windows installer signing: unsigned-release. Verify SHA-256 before running; SmartScreen may warn.' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            }
          } finally {
            if ($pfx) {
              Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Upload verified Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mimi-remote-windows-installer
          path: dist-windows/
          if-no-files-found: error

  prepare-release:
    needs:
      - source-trust
      - verify-safety
      - verify
      - verify-windows
    if: github.repository == 'gaixianggeng/mimi-remote'
    runs-on: macos-26
    timeout-minutes: 45
    environment: production-release
    outputs:
      linux_artifacts: ${{ steps.linux-assets.outputs.artifact-id }}
      other_artifacts: ${{ steps.other-assets.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.source-trust.outputs.tag_sha }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install universal macOS Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Setup Bun
        # 安装包内嵌的 Claude 适配器用 Bun 编译，版本固定为 .bun-version（#660）。
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: bridges/claude-sdk/.bun-version

      - name: Build Codex Skill package
        run: bash ./scripts/package-skill.sh dist-skill

      - name: Build, sign, and notarize Mac installer
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          bash ./scripts/build-macos-installer.sh \
            --version "${RELEASE_TAG#v}" \
            --build-number "$GITHUB_RUN_NUMBER" \
            --output-dir dist-macos

      - name: Check signed Mac installer
        run: bash ./scripts/check-macos-installer.sh --require-notarization dist-macos/Mimi-Remote-Mac.dmg

      - name: Prepare signed release artifacts
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: "v2.15.3"
          args: release --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ env.RELEASE_TAG }}
          TAP_DEPLOY_KEY: build-only-not-used
          GOTOOLCHAIN: local
          MIMI_MACOS_SIGNING: required
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}

      - name: Check signed release artifacts
        env:
          MIMI_REQUIRE_MACOS_SIGNATURE: "1"
        run: bash ./scripts/check-release-artifacts.sh

      - name: Stage Linux archives and checksums
        id: linux-assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-release-${{ github.run_attempt }}
          path: |
            dist/*_linux_*.tar.gz
            dist/checksums.txt
          if-no-files-found: error
          compression-level: 0

      - name: Stage remaining release artifacts and metadata
        id: other-assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: remaining-release-${{ github.run_attempt }}
          path: |
            dist/*_darwin_*.tar.gz
            dist/CHANGELOG.md
            dist/homebrew/Formula/mimi-remote.rb
            dist-macos/Mimi-Remote-Mac.dmg*
            dist-skill/install-mimi-remote.zip*
          if-no-files-found: error
          compression-level: 0

  linux-smoke:
    needs: [source-trust, prepare-release]
    if: github.repository == 'gaixianggeng/mimi-remote'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Checkout verified release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.source-trust.outputs.tag_sha }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: experiments/tailcat/go.mod
          cache-dependency-path: experiments/tailcat/go.sum
      - name: Require the prepared Linux artifact ID
        env:
          LINUX_ARTIFACT_ID: ${{ needs.prepare-release.outputs.linux_artifacts }}
        run: '[[ "$LINUX_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.prepare-release.outputs.linux_artifacts }}
          path: linux-dist
          merge-multiple: true
      - name: Pair with the released Linux executable
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          host="$(go env GOHOSTOS)/$(go env GOHOSTARCH)"
          [[ "$host" == "linux/$TARGET_ARCH" ]] || { echo "Expected linux/$TARGET_ARCH, got $host" >&2; exit 1; }
          archive="mimi-remote_${RELEASE_TAG#v}_linux_${TARGET_ARCH}.tar.gz"
          (cd linux-dist && sha256sum --strict --check --ignore-missing checksums.txt)
          digest="$(sha256sum "linux-dist/$archive" | cut -d' ' -f1)"
          grep -Fxq "$digest  $archive" linux-dist/checksums.txt
          tar -xzf "linux-dist/$archive" -C "$RUNNER_TEMP" mimi-tailcat-experiment
          binary="$RUNNER_TEMP/mimi-tailcat-experiment"
          version="$("$binary" version)"
          [[ "$version" == "${RELEASE_TAG#v}" ]] || { echo "Archive version $version differs from $RELEASE_TAG" >&2; exit 1; }
          GOFLAGS=-json bash ./scripts/test-linux-tailcat-package.sh "$binary" | tee "$RUNNER_TEMP/pairing.jsonl"
          jq -es '[.[] | select(.Test == "TestPackagedTailcatStartsAndPairs" and .Action == "pass")] | length == 1' "$RUNNER_TEMP/pairing.jsonl"
          echo "Passed Linux $TARGET_ARCH pairing: \`$archive\` SHA-256 \`$digest\`" >> "$GITHUB_STEP_SUMMARY"

  release:
    needs:
      - source-trust
      - verify-safety
      - prepare-release
      - linux-smoke
    if: github.repository == 'gaixianggeng/mimi-remote'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-release
    permissions:
      contents: write
    steps:
      - name: Require both prepared artifact IDs
        env:
          LINUX_ARTIFACT_ID: ${{ needs.prepare-release.outputs.linux_artifacts }}
          OTHER_ARTIFACT_ID: ${{ needs.prepare-release.outputs.other_artifacts }}
        run: '[[ "$LINUX_ARTIFACT_ID" =~ ^[1-9][0-9]*$ && "$OTHER_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]'
      - name: Download smoke-tested Linux archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.prepare-release.outputs.linux_artifacts }}
          path: dist
          merge-multiple: true
      - name: Download remaining verified release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.prepare-release.outputs.other_artifacts }}
          merge-multiple: true
      - name: Publish verified artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum --strict --check checksums.txt)
          (cd dist-macos && sha256sum --strict --check Mimi-Remote-Mac.dmg.sha256)
          (cd dist-skill && sha256sum --strict --check install-mimi-remote.zip.sha256)
          if ! draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$RELEASE_TAG" --notes-file dist/CHANGELOG.md
            draft=true
          fi
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            dist/*.tar.gz dist/checksums.txt dist-macos/Mimi-Remote-Mac.dmg{,.sha256} dist-skill/install-mimi-remote.zip{,.sha256}
          assets="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets)"
          for archive in dist/*_linux_*.tar.gz; do
            digest="$(sha256sum "$archive" | cut -d' ' -f1)"
            jq -e --arg name "${archive##*/}" --arg digest "sha256:$digest" \
              'any(.assets[]; .name == $name and .digest == $digest)' <<< "$assets"
          done
          if [[ "$draft" == true ]]; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          fi
      - name: Checkout Homebrew Tap
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: gaixianggeng/homebrew-tap
          ref: main
          path: tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
      - name: Publish verified Homebrew Formula
        shell: bash
        run: |
          cp dist/homebrew/Formula/mimi-remote.rb tap/Formula/mimi-remote.rb
          git -C tap add -- Formula/mimi-remote.rb
          if ! git -C tap diff --cached --quiet; then
            git -C tap -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -m "Update mimi-remote to $RELEASE_TAG"
            git -C tap push origin HEAD:main
          fi

  publish-windows:
    needs:
      - source-trust
      - verify-safety
      - release
      - verify-windows
    if: github.repository == 'gaixianggeng/mimi-remote'
    runs-on: windows-latest
    timeout-minutes: 10
    environment: production-release
    permissions:
      contents: write
    steps:
      - name: Download verified Windows installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mimi-remote-windows-installer
          path: dist-windows

      - name: Upload Windows installer to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem -LiteralPath dist-windows -File
          gh release upload $env:RELEASE_TAG $files.FullName --clobber --repo $env:GITHUB_REPOSITORY
