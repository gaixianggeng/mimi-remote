name: GH491 Mac source verification
on:
  push:
    branches: [codex/gh-491-implementation-assembly]
permissions:
  contents: read
jobs:
  assemble:
    if: github.ref == 'refs/heads/codex/gh-491-implementation-assembly'
    runs-on: macos-latest
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply and verify source
        shell: bash
        run: |
          set -euo pipefail
          python3 .gh491/apply.py
          git diff --name-only -- '*.go' | xargs gofmt -w
          git diff --check
          go test ./internal/config ./internal/setup ./internal/httpapi ./internal/doctor ./cmd/agentd -run '^TestModule' -count=1
          xcodebuild -version
          sdk="$(xcrun --sdk macosx --show-sdk-path)"
          find macos/MimiRemoteMac/Sources -name '*.swift' -print0 | xargs -0 xcrun swiftc -typecheck -parse-as-library -D DEBUG -module-name MimiRemoteMac -swift-version 5 -target "$(uname -m)-apple-macosx15.0" -sdk "$sdk"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf .gh491
          rm .github/workflows/gh491-assembly.yml
          git add -A
          git commit -m 'feat(mac): wire module controls, settings and safe pairing (Refs #491)'
          echo "ASSEMBLED_TREE=$(git rev-parse HEAD^{tree})"
          echo "ASSEMBLED_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:codex/gh-491-implementation-assembly
