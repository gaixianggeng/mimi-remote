name: Windows installer isolated acceptance

on:
  push:
    branches: [codex/gh-979-installer-acceptance]

permissions:
  contents: read

concurrency:
  group: windows-installer-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    if: github.repository == 'gaixianggeng/mimi-remote'
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: windows/global.json
      - name: Read Bun version
        id: bun
        shell: pwsh
        run: '"version=$((Get-Content bridges/claude-sdk/.bun-version -Raw).Trim())" >> $env:GITHUB_OUTPUT'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-download-url: https://github.com/oven-sh/bun/releases/download/bun-v${{ steps.bun.outputs.version }}/bun-windows-x64-baseline.zip
      - name: Build and verify unsigned release candidate
        shell: pwsh
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Requires an isolated GitHub VM' }
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          $env:MIMI_DOTNET_ARTIFACTS = Join-Path $env:RUNNER_TEMP 'dotnet'
          $output = Join-Path $env:RUNNER_TEMP 'installer-acceptance'
          ./scripts/build-windows-installer.ps1 -Version 1.1.15-acceptance -OutputDirectory $output -AllowUnsignedRelease
          ./scripts/check-windows-installer.ps1 -InstallerPath (Join-Path $output 'Mimi-Remote-Setup-1.1.15-acceptance-unsigned.exe') -ExpectedVersion 1.1.15-acceptance
      - name: Install, upgrade, roll back, and uninstall in the disposable VM
        shell: pwsh
        run: |
          try { ./scripts/test-windows-installer-e2e.ps1 }
          catch {
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-5) } -ErrorAction SilentlyContinue |
              Where-Object { $_.Message -match 'MimiRemote\.exe|mimi-remote-tray\.exe' } |
              Select-Object -First 5 -ExpandProperty Message | Write-Host
            throw
          }
