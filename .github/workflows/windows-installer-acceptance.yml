name: Windows installer signing fixture

on:
  push:
    branches: [codex/gh-979-signing-acceptance]

permissions:
  contents: read

concurrency:
  group: windows-installer-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    if: github.repository == 'gaixianggeng/mimi-remote'
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: windows/global.json
      - name: Read Bun version
        id: bun
        shell: pwsh
        run: '"version=$((Get-Content bridges/claude-sdk/.bun-version -Raw).Trim())" >> $env:GITHUB_OUTPUT'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-download-url: https://github.com/oven-sh/bun/releases/download/bun-v${{ steps.bun.outputs.version }}/bun-windows-x64-baseline.zip
      - name: Provision a VM-local signing fixture without UI
        timeout-minutes: 3
        shell: pwsh
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or $env:GITHUB_REF -ne 'refs/heads/codex/gh-979-signing-acceptance') {
            throw 'Requires the dedicated GitHub-hosted test VM'
          }
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          $cer = Join-Path $env:RUNNER_TEMP 'mimi-signing-fixture.cer'
          $pfx = Join-Path $env:RUNNER_TEMP 'mimi-signing-fixture.pfx'
          $password = [Convert]::ToHexString([Security.Cryptography.RandomNumberGenerator]::GetBytes(24))
          Write-Host "::add-mask::$password"
          $fixture = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=Mimi Remote CI Signing Fixture' -CertStoreLocation Cert:\CurrentUser\My -KeyExportPolicy Exportable -NotAfter (Get-Date).AddDays(1)
          "MIMI_FIXTURE_THUMBPRINT=$($fixture.Thumbprint)" >> $env:GITHUB_ENV
          "MIMI_FIXTURE_PASSWORD=$password" >> $env:GITHUB_ENV
          Export-Certificate -Cert $fixture -FilePath $cer | Out-Null
          Export-PfxCertificate -Cert $fixture -FilePath $pfx -Password (ConvertTo-SecureString $password -AsPlainText -Force) | Out-Null
          Write-Host 'Disposable signing fixture exported.'
          & certutil.exe -f -addstore Root $cer
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath "Cert:\LocalMachine\Root\$($fixture.Thumbprint)")) {
            throw 'The disposable VM could not trust its own fixture.'
          }
      - name: Build the candidate with its VM-local certificate and validate Authenticode
        timeout-minutes: 22
        shell: pwsh
        run: |
          $env:MIMI_DOTNET_ARTIFACTS = Join-Path $env:RUNNER_TEMP 'dotnet'
          $output = Join-Path $env:RUNNER_TEMP 'installer-acceptance'
          $pfx = Join-Path $env:RUNNER_TEMP 'mimi-signing-fixture.pfx'
          ./scripts/build-windows-installer.ps1 -Version 1.1.15-acceptance -OutputDirectory $output -PfxPath $pfx -PfxPassword $env:MIMI_FIXTURE_PASSWORD
          ./scripts/check-windows-installer.ps1 -InstallerPath (Join-Path $output 'Mimi-Remote-Setup-1.1.15-acceptance.exe') -ExpectedVersion 1.1.15-acceptance -RequireSignature
      - name: Install, verify the fixture signer, roll back, and uninstall
        timeout-minutes: 10
        shell: pwsh
        run: ./scripts/test-windows-installer-e2e.ps1
      - name: Remove the isolated test certificate
        if: always() && runner.environment == 'github-hosted'
        shell: pwsh
        run: |
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'mimi-signing-fixture.cer'),(Join-Path $env:RUNNER_TEMP 'mimi-signing-fixture.pfx') -Force -ErrorAction SilentlyContinue
          if ($env:MIMI_FIXTURE_THUMBPRINT -match '^[0-9A-F]{40}$') {
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$env:MIMI_FIXTURE_THUMBPRINT","Cert:\LocalMachine\Root\$env:MIMI_FIXTURE_THUMBPRINT" -Force -ErrorAction SilentlyContinue
          }
