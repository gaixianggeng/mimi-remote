name: Public Repository Safety

on:
  workflow_call:
    inputs:
      mode:
        description: full-history 或 pull-request
        required: false
        default: full-history
        type: string
      base_sha:
        description: pull-request 模式的 base commit
        required: false
        default: ""
        type: string
      head_sha:
        description: pull-request 模式的 head commit
        required: false
        default: ""
        type: string
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-repo-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Plan repository safety checks
        id: safety
        shell: bash
        env:
          SAFETY_MODE: ${{ inputs.mode || 'full-history' }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          case "$SAFETY_MODE" in
            pull-request)
              bash ./scripts/check-public-repo-safety.sh \
                --pull-request \
                --base "$BASE_SHA" \
                --head "$HEAD_SHA" \
                --plan \
                --github-output "$GITHUB_OUTPUT"
              ;;
            full-history)
              bash ./scripts/check-public-repo-safety.sh \
                --full-history \
                --plan \
                --github-output "$GITHUB_OUTPUT"
              ;;
            *)
              echo "未知 Public Repository Safety 模式：$SAFETY_MODE" >&2
              exit 1
              ;;
          esac

      - name: Setup Go
        if: steps.safety.outputs.third_party == 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install repository safety tools
        run: |
          if command -v rg >/dev/null 2>&1; then
            rg --version
          else
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y ripgrep
          fi

      - name: Check public repository safety
        shell: bash
        env:
          SAFETY_MODE: ${{ inputs.mode || 'full-history' }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          case "$SAFETY_MODE" in
            pull-request)
              bash ./scripts/check-public-repo-safety.sh \
                --pull-request \
                --base "$BASE_SHA" \
                --head "$HEAD_SHA"
              ;;
            full-history)
              bash ./scripts/check-public-repo-safety.sh --full-history
              ;;
            *)
              echo "未知 Public Repository Safety 模式：$SAFETY_MODE" >&2
              exit 1
              ;;
          esac
