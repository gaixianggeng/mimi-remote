name: Mac App CI

on:
  workflow_call:
  push:
    branches:
      - main
    paths:
      - "macos/MimiRemoteMac/**"
      - "scripts/test-macos-app.sh"
      - ".github/workflows/macos-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    # GitHub 的全新 macOS runner 首次编译 Swift、Go 与 Rust bridge 已连续两次
    # 超过 20 分钟；本地增量构建不能代表 CI 冷构建耗时。保留有限上限，同时
    # 给完整 Scheme 测试足够的收尾时间。
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Show toolchain
        run: |
          xcodebuild -version
          go version
          rustc --version

      - name: Build and test Mac App
        env:
          MACOS_DERIVED_DATA_PATH: ${{ runner.temp }}/MimiRemoteMacDerivedData
        run: bash ./scripts/test-macos-app.sh
