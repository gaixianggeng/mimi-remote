name: Docs and static policy

on:
  workflow_call:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "README.zh-CN.md"
      - "CONTRIBUTING.md"
      - "docs/**"
      - "scripts/check-docs-static.sh"
      - "scripts/check-packaging.sh"
      - "scripts/check-app-store-metadata.sh"
      - "scripts/check-nightly-release.sh"
      - "scripts/generate-nightly-what-to-test.rb"
      - ".github/workflows/docs-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check docs and static policy
        run: bash ./scripts/check-docs-static.sh
