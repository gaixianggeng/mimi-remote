name: iOS CI

on:
  workflow_call:
    inputs:
      source_ref:
        description: "要验证的 immutable commit；为空时使用触发事件 SHA"
        required: false
        default: ""
        type: string
      publish_internal_testflight:
        description: "由 Nightly reusable workflow 上传 Internal TestFlight"
        required: false
        default: false
        type: boolean
      what_to_test:
        description: "TestFlight What to Test"
        required: false
        default: "Nightly Internal TestFlight"
        type: string
  push:
    branches:
      - main
    paths:
      - "ios/MimiRemote/**"
      - "contracts/mimi-protocol/**"
      - "internal/protocolcontract/**"
      - "scripts/ios-dev.sh"
      - "scripts/ios-device-lease.sh"
      - "scripts/test-ios-device-management.sh"
      - "scripts/testdata/ios-device-management/**"
      - "scripts/test-conversation-regressions.sh"
      - "scripts/check-critical-regressions.sh"
      - "scripts/test-ios-localization-smoke.sh"
      - "scripts/check-ios-localization.sh"
      - "scripts/check-ios-network-security.sh"
      - "scripts/check-ios-privacy-manifest.sh"
      - "scripts/check-app-store-metadata.sh"
      - "scripts/ios_asc_cli.sh"
      - "scripts/test-ios-asc-cli.sh"
      - "scripts/check-source-size.sh"
      - ".github/workflows/ios-ci.yml"
      - ".github/workflows/nightly.yml"
      - "scripts/check-nightly-release.sh"
      - "scripts/generate-nightly-what-to-test.rb"
      - "scripts/check-pr-gate.sh"
      - "scripts/ci-pr-scope.sh"
      - "config/release/ios-asc-cli.env"
      - "config/release/ios-testflight.local.env"
      - ".xcodebuildmcp/config.yaml"
  workflow_dispatch:
    inputs:
      publish_app_store:
        description: "在稳定 macOS 26 runner 上归档并上传 Internal TestFlight（不提交 App Store 审核）"
        required: true
        default: false
        type: boolean
      what_to_test:
        description: "TestFlight What to Test"
        required: true
        default: "Internal TestFlight 正式候选：使用稳定 macOS 26 与 Xcode 26.6 重新归档。"
        type: string

permissions:
  contents: read

concurrency:
  # 普通回归与签名发布使用不同组：新提交可以取消过时的 Simulator 回归，
  # 但不能取消或排队阻塞同一 main 上正在执行的 TestFlight 上传。
  group: >-
    ios-ci-${{ (inputs.publish_internal_testflight || (github.event_name == 'workflow_dispatch' && inputs.publish_app_store)) && 'release' || 'regression' }}-${{ github.ref }}
  cancel-in-progress: >-
    ${{ !(inputs.publish_internal_testflight || (github.event_name == 'workflow_dispatch' && inputs.publish_app_store)) }}

jobs:
  conversation-regressions:
    # 使用稳定版 Xcode 26 / iOS 26 Simulator 运行回归；工程仍以 iOS 18 为 deployment target，
    # 因此编译阶段会检查所有 iOS 26+ API 是否具备有效 availability fallback。
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
          clean: true

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list devices available

      - name: Verify iOS 18 deployment target
        shell: bash
        run: |
          set -euo pipefail
          for target_name in \
            MimiRemote \
            MimiCarStatusWidgetExtension \
            MimiRemoteTests \
            MimiRemoteUITests
          do
            deployment_targets="$(
              xcodebuild \
                -project ios/MimiRemote/MimiRemote.xcodeproj \
                -target "$target_name" \
                -configuration Debug \
                -showBuildSettings 2>/dev/null \
                | awk '$1 == "IPHONEOS_DEPLOYMENT_TARGET" && $2 == "=" { print $3 }' \
                | sort -u
            )"
            if [[ "$deployment_targets" != "18.0" ]]; then
              echo "$target_name expected iOS deployment target 18.0, got: $deployment_targets" >&2
              exit 1
            fi
          done

      - name: Resolve fixed CI simulator
        shell: bash
        run: |
          set -euo pipefail
          destination="$(bash ./scripts/ios-dev.sh test-destination)"
          echo "Resolved exact test target: $destination"
          echo "IOS_TEST_DESTINATION=$destination" >> "$GITHUB_ENV"

      - name: Check iOS device selection and leases
        run: bash ./scripts/test-ios-device-management.sh

      - name: Check network security policy
        run: bash ./scripts/check-ios-network-security.sh

      - name: Check privacy manifest
        run: bash ./scripts/check-ios-privacy-manifest.sh

      - name: Check iOS localization
        run: bash ./scripts/check-ios-localization.sh

      - name: Check App Store metadata
        run: bash ./scripts/check-app-store-metadata.sh

      - name: Check pinned asc CLI integration
        run: bash ./scripts/test-ios-asc-cli.sh

      - name: Check source size
        run: bash ./scripts/check-source-size.sh

      - name: Run core regressions
        # Go 与共享契约由独立 Go CI 覆盖；macOS runner 只执行 iOS selector。
        run: bash ./scripts/test-conversation-regressions.sh --ios-only

      # 日常核心回归已经覆盖 LocalizationTests；只有真正发布 TestFlight 时
      # 才额外启动一次英文系统环境，避免每个 PR/main 都承担第二次 Simulator 启动。
      - name: Run English localization smoke
        if: >-
          inputs.publish_internal_testflight ||
          (github.event_name == 'workflow_dispatch' && inputs.publish_app_store)
        run: bash ./scripts/test-ios-localization-smoke.sh

  app-store-release:
    needs: conversation-regressions
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.publish_app_store) ||
      inputs.publish_internal_testflight
    runs-on: macos-26
    timeout-minutes: 45
    env:
      IOS_BUNDLE_ID: com.gaixianggeng.mimi
      IOS_WIDGET_BUNDLE_ID: com.gaixianggeng.mimi.carstatuswidget
      DEVELOPMENT_TEAM: 9HZ89R58PZ
      TESTFLIGHT_BETA_GROUP_ID: 26b7c973-b94f-46d5-b300-1c252fd6fdb1
      IOS_TESTFLIGHT_UPLOAD: >-
        ${{ ((github.event_name == 'workflow_dispatch' && inputs.publish_app_store) ||
          inputs.publish_internal_testflight) && '1' || '0' }}
      IOS_TESTFLIGHT_VALIDATE: "0"
      IOS_RELEASE_EXPECTED_MACOS_MAJOR: "26"
      IOS_RELEASE_EXPECTED_XCODE_VERSION: "26.6"
      IOS_RELEASE_EXPECTED_XCODE_BUILD: 17F113
      IOS_RELEASE_EXPECTED_SDK_VERSION: "26.5"
      IOS_RELEASE_EXPECTED_SDK_BUILD: 23F81a
      # 第一阶段只记录差异；Ruby 预检仍是实际构建号的唯一来源。
      IOS_ASC_BUILD_NUMBER_MODE: shadow
      TESTFLIGHT_WHATS_NEW: ${{ inputs.what_to_test }}
    steps:
      - name: Checkout clean release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
          clean: true

      # 所有签名材料都在后续 step 才注入；这里先锁定官方仓库当前 main
      # 的同一个 immutable commit，手工从其他分支触发会 fail closed。
      - name: Trust gate before App Store signing
        shell: bash
        env:
          CANDIDATE_SOURCE_REF: ${{ inputs.source_ref || github.sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "gaixianggeng/mimi-remote" ]] \
            || { echo "iOS TestFlight 只允许在官方仓库运行。" >&2; exit 1; }
          [[ "$GITHUB_REF" == "refs/heads/main" ]] \
            || { echo "iOS TestFlight 只允许从 refs/heads/main 运行。" >&2; exit 1; }
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "iOS TestFlight 需要 40 位 immutable event SHA。" >&2; exit 1; }
          [[ "$CANDIDATE_SOURCE_REF" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "iOS TestFlight source_ref 必须是 40 位 commit SHA。" >&2; exit 1; }
          head_sha="$(git rev-parse HEAD)"
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          [[ "$head_sha" == "$GITHUB_SHA" &&
            "$GITHUB_SHA" == "$CANDIDATE_SOURCE_REF" &&
            "$main_sha" == "$CANDIDATE_SOURCE_REF" ]] \
            || {
              echo "iOS TestFlight source 不是当前 origin/main：head=$head_sha event=$GITHUB_SHA source=$CANDIDATE_SOURCE_REF main=$main_sha" >&2
              exit 1
            }

      - name: Select exact stable Xcode
        shell: bash
        run: |
          set -euo pipefail
          selected_developer_dir=""
          for app in /Applications/Xcode*.app; do
            [[ -d "$app/Contents/Developer" ]] || continue
            version="$(
              DEVELOPER_DIR="$app/Contents/Developer" xcodebuild -version
            )"
            if [[ "$version" == $'Xcode 26.6\nBuild version 17F113' ]]; then
              selected_developer_dir="$app/Contents/Developer"
              break
            fi
          done
          [[ -n "$selected_developer_dir" ]] || {
            echo "Xcode 26.6 (17F113) is not installed on this runner." >&2
            find /Applications -maxdepth 1 -name 'Xcode*.app' -print >&2
            exit 1
          }
          echo "DEVELOPER_DIR=$selected_developer_dir" >> "$GITHUB_ENV"

      - name: Verify stable host and SDK
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-build-version
          [[ "$(sw_vers -productVersion)" == 26.* ]]
          [[ "$(xcodebuild -version)" == $'Xcode 26.6\nBuild version 17F113' ]]
          [[ "$(xcrun --sdk iphoneos --show-sdk-version)" == "26.5" ]]
          [[ "$(xcrun --sdk iphoneos --show-sdk-build-version)" == "23F81a" ]]

      - name: Prepare pinned asc CLI shadow tool
        shell: bash
        run: |
          set -euo pipefail
          asc_bin="$RUNNER_TEMP/mimi-release-tools/asc"
          echo "ASC_CLI_BIN=$asc_bin" >> "$GITHUB_ENV"
          if ! bash ./scripts/ios_asc_cli.sh install --destination "$asc_bin"; then
            echo "::warning::固定版本 asc 安装或校验失败；本次发布保留 Ruby 预检并记录 shadow error。"
          fi

      - name: Prepare App Store signing
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          IOS_APPSTORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROVISIONING_PROFILE_BASE64 }}
          IOS_WIDGET_APPSTORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_APPSTORE_PROVISIONING_PROFILE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          for secret_name in \
            ASC_KEY_ID \
            ASC_ISSUER_ID \
            ASC_PRIVATE_KEY \
            IOS_APPSTORE_PROVISIONING_PROFILE_BASE64 \
            IOS_WIDGET_APPSTORE_PROVISIONING_PROFILE_BASE64 \
            IOS_DISTRIBUTION_CERTIFICATE_BASE64 \
            IOS_DISTRIBUTION_CERTIFICATE_PASSWORD \
            IOS_KEYCHAIN_PASSWORD; do
            [[ -n "${!secret_name}" ]] || {
              echo "Required GitHub Actions secret is empty: $secret_name" >&2
              exit 1
            }
          done

          release_secrets="$RUNNER_TEMP/ios-release-secrets"
          mkdir -p "$release_secrets"
          chmod 700 "$release_secrets"

          api_key="$release_secrets/AuthKey_${ASC_KEY_ID}.p8"
          certificate="$release_secrets/distribution.p12"
          profile="$release_secrets/app-store.mobileprovision"
          profile_plist="$release_secrets/profile.plist"
          widget_profile="$release_secrets/widget-app-store.mobileprovision"
          widget_profile_plist="$release_secrets/widget-profile.plist"
          keychain="$release_secrets/signing.keychain-db"

          printf '%s' "$ASC_PRIVATE_KEY" > "$api_key"
          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          printf '%s' "$IOS_APPSTORE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile"
          printf '%s' "$IOS_WIDGET_APPSTORE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$widget_profile"
          chmod 600 "$api_key" "$certificate" "$profile" "$widget_profile"

          security cms -D -i "$profile" > "$profile_plist"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist")"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")"
          profile_team="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$profile_plist")"
          profile_app_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile_plist")"
          profile_expiration="$(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$profile_plist")"
          profile_app_groups="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups' "$profile_plist")"
          [[ "$profile_team" == "$DEVELOPMENT_TEAM" ]]
          [[ "$profile_app_id" == "$DEVELOPMENT_TEAM.$IOS_BUNDLE_ID" ]]
          [[ "$profile_app_groups" == *"group.com.gaixianggeng.mimi"* ]]
          ruby -rtime -e 'exit(Time.parse(ARGV.fetch(0)) > Time.now ? 0 : 1)' "$profile_expiration"

          security cms -D -i "$widget_profile" > "$widget_profile_plist"
          widget_profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$widget_profile_plist")"
          widget_profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$widget_profile_plist")"
          widget_profile_team="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$widget_profile_plist")"
          widget_profile_app_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$widget_profile_plist")"
          widget_profile_expiration="$(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$widget_profile_plist")"
          widget_profile_app_groups="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups' "$widget_profile_plist")"
          [[ "$widget_profile_team" == "$DEVELOPMENT_TEAM" ]]
          [[ "$widget_profile_app_id" == "$DEVELOPMENT_TEAM.$IOS_WIDGET_BUNDLE_ID" ]]
          [[ "$widget_profile_app_groups" == *"group.com.gaixianggeng.mimi"* ]]
          ruby -rtime -e 'exit(Time.parse(ARGV.fetch(0)) > Time.now ? 0 : 1)' "$widget_profile_expiration"

          profiles_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles_dir"
          cp "$profile" "$profiles_dir/$profile_uuid.mobileprovision"
          cp "$widget_profile" "$profiles_dir/$widget_profile_uuid.mobileprovision"

          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" \
            -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$IOS_KEYCHAIN_PASSWORD" \
            "$keychain"
          original_keychains=()
          while IFS= read -r existing_keychain; do
            [[ -n "$existing_keychain" ]] && original_keychains+=("$existing_keychain")
          done < <(
            security list-keychains -d user \
              | sed -E 's/^[[:space:]]*"([^"]+)"[[:space:]]*$/\1/'
          )
          security list-keychains -d user -s "$keychain" "${original_keychains[@]}"

          signing_identity="$(
            security find-identity -v -p codesigning "$keychain" \
              | sed -nE 's/.*"((Apple|iPhone) Distribution:[^"]+)".*/\1/p' \
              | head -n 1
          )"
          [[ -n "$signing_identity" && "$signing_identity" == *"($DEVELOPMENT_TEAM)" ]]

          {
            echo "APP_STORE_CONNECT_API_KEY_ID=$ASC_KEY_ID"
            echo "APP_STORE_CONNECT_API_ISSUER_ID=$ASC_ISSUER_ID"
            echo "APP_STORE_CONNECT_API_KEY_PATH=$api_key"
            echo "IOS_SIGNING_KEYCHAIN_PATH=$keychain"
            echo "IOS_PROVISIONING_PROFILE_SPECIFIER<<__PROFILE__"
            echo "$profile_name"
            echo "__PROFILE__"
            echo "IOS_WIDGET_PROVISIONING_PROFILE_SPECIFIER<<__WIDGET_PROFILE__"
            echo "$widget_profile_name"
            echo "__WIDGET_PROFILE__"
            echo "IOS_CODE_SIGN_IDENTITY<<__IDENTITY__"
            echo "$signing_identity"
            echo "__IDENTITY__"
          } >> "$GITHUB_ENV"

      - name: Archive, audit, upload, and distribute build
        shell: bash
        run: bash ./scripts/ios_testflight_ci.sh

      - name: Write Nightly TestFlight evidence
        if: inputs.publish_internal_testflight
        shell: bash
        env:
          EVIDENCE_SHA: ${{ inputs.source_ref || github.sha }}
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/mimi-testflight-evidence"
          mkdir -p "$evidence_dir"
          EVIDENCE_PATH="$evidence_dir/evidence.json" \
            ruby -rtime -rjson -e '
              path = ENV.fetch("EVIDENCE_PATH")
              payload = {
                source_sha: ENV.fetch("EVIDENCE_SHA"),
                run_id: ENV.fetch("GITHUB_RUN_ID"),
                run_attempt: ENV.fetch("GITHUB_RUN_ATTEMPT", "1"),
                repository: ENV.fetch("GITHUB_REPOSITORY"),
                workflow: ENV.fetch("GITHUB_WORKFLOW"),
                event: ENV.fetch("GITHUB_EVENT_NAME"),
                uploaded: true,
                uploaded_at_utc: Time.now.utc.iso8601
              }
              File.write(path, JSON.pretty_generate(payload) + "\n")
            '
          ruby -rjson -e '
            value = JSON.parse(File.read(ARGV.fetch(0)))
            abort "Nightly evidence uploaded 必须为 true" unless value["uploaded"] == true
            abort "Nightly evidence source_sha 不完整" unless value["source_sha"].match?(/\A[0-9a-f]{40}\z/)
          ' "$evidence_dir/evidence.json"

      - name: Upload Nightly TestFlight evidence
        if: inputs.publish_internal_testflight
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-testflight-${{ inputs.source_ref || github.sha }}
          path: ${{ runner.temp }}/mimi-testflight-evidence/evidence.json
          if-no-files-found: error
          retention-days: 30
