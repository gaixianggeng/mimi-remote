name: iOS CI

on:
  workflow_call:
    inputs:
      source_ref:
        description: "要验证的 immutable commit；为空时使用触发事件 SHA"
        required: false
        default: ""
        type: string
      publish_internal_testflight:
        description: "由 Nightly reusable workflow 上传 Internal TestFlight"
        required: false
        default: false
        type: boolean
      what_to_test:
        description: "TestFlight What to Test"
        required: false
        default: "Nightly Internal TestFlight"
        type: string
  push:
    branches:
      - main
    paths:
      - "contracts/host-cli/**"
      - "ios/MimiRemote/**"
      - "experiments/tailcat/**"
      - "contracts/mimi-protocol/**"
      - "internal/protocolcontract/**"
      - "scripts/ios-dev.sh"
      - "scripts/build-tailcat-mobile.sh"
      - "scripts/ios-device-lease.sh"
      - "scripts/ios-build-evidence.sh"
      - "scripts/ios-device-gui-handoff-macos.sh"
      - "scripts/test-ios-device-management.sh"
      - "scripts/test-ios-build-evidence.sh"
      - "scripts/test-tailcat-mobile-build.sh"
      - "scripts/test-ios-device-gui-handoff-macos.sh"
      - "scripts/testdata/ios-device-management/**"
      - "scripts/testdata/tailcat-mobile/**"
      - "scripts/test-conversation-regressions.sh"
      - "scripts/check-critical-regressions.sh"
      - "scripts/ios-test-inventory.py"
      - "scripts/check-ios-test-selectors.sh"
      - "scripts/test-ios-test-inventory.sh"
      - "scripts/test-ios-full-suite.sh"
      - "config/ios-tests/**"
      - "scripts/test-ios-localization-smoke.sh"
      - "scripts/check-ios-localization.sh"
      - "scripts/test-check-ios-localization.sh"
      - "scripts/check-ios-network-security.sh"
      - "scripts/check-ios-privacy-manifest.sh"
      - "scripts/check-app-store-metadata.sh"
      - "scripts/ios_asc_cli.sh"
      - "scripts/test-ios-asc-cli.sh"
      - "scripts/check-source-size.sh"
      - ".github/workflows/ios-ci.yml"
      - ".github/workflows/nightly.yml"
      - "scripts/check-nightly-release.sh"
      - "scripts/generate-nightly-what-to-test.rb"
      - "scripts/check-pr-gate.sh"
      - "scripts/ci-pr-scope.sh"
      - "config/release/ios-asc-cli.env"
      - "config/release/ios-testflight.local.env"
      - ".xcodebuildmcp/config.yaml"
  workflow_dispatch:
    inputs:
      publish_app_store:
        description: "在稳定 macOS 26 runner 上归档并上传 Internal TestFlight（不提交 App Store 审核）"
        required: true
        default: false
        type: boolean
      what_to_test:
        description: "TestFlight What to Test"
        required: true
        default: "Internal TestFlight 正式候选：使用稳定 macOS 26 与 Xcode 26.6 重新归档。"
        type: string

permissions:
  contents: read

concurrency:
  # 普通回归与签名发布使用不同组：新提交可以取消过时的 Simulator 回归，
  # 但不能取消或排队阻塞同一 main 上正在执行的 TestFlight 上传。
  group: >-
    ios-ci-${{ (inputs.publish_internal_testflight || (github.event_name == 'workflow_dispatch' && inputs.publish_app_store)) && 'release' || 'regression' }}-${{ github.ref }}
  cancel-in-progress: >-
    ${{ !(inputs.publish_internal_testflight || (github.event_name == 'workflow_dispatch' && inputs.publish_app_store)) }}

jobs:
  image-recovery-ui-regressions:
    name: Image recovery UI regressions
    # 与 conversation-regressions 并行执行，避免 2 项真实图片卡点击 UI 回归串行拉长关键路径。
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          clean: true

      - name: Setup Go for Tailcat
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: experiments/tailcat/go.mod
          cache-dependency-path: experiments/tailcat/go.sum

      - name: Resolve toolchain and pre-boot fixed CI simulator
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcode_version="$(xcodebuild -version)"
          iphoneos_sdk="$(xcrun --sdk iphoneos --show-sdk-build-version)"
          simulator_sdk="$(xcrun --sdk iphonesimulator --show-sdk-build-version)"
          go_version="$(cd experiments/tailcat && go version && go env GOVERSION GOHOSTOS GOHOSTARCH)"
          tailcat_key="$(printf '%s\n%s\n%s\n' "$go_version" "$iphoneos_sdk" "$simulator_sdk" | shasum -a 256 | awk '{ print substr($1, 1, 16) }')"
          xcode_key="$(printf '%s\n%s\n' "$xcode_version" "$simulator_sdk" | shasum -a 256 | awk '{ print substr($1, 1, 16) }')"
          echo "tailcat_key=$tailcat_key" >> "$GITHUB_OUTPUT"
          echo "xcode_key=$xcode_key" >> "$GITHUB_OUTPUT"

          simulator_id="$(xcrun simctl list devices available -j | ruby -rjson -e '
            devices = JSON.parse(STDIN.read).fetch("devices").fetch("com.apple.CoreSimulator.SimRuntime.iOS-26-2", [])
            device = devices.find { |item| item["isAvailable"] && item["name"] == "iPad Pro 13-inch (M5)" }
            abort "Missing iPad Pro 13-inch (M5) on iOS 26.2" unless device
            puts device.fetch("udid")
          ')"
          destination="$(IOS_TEST_DESTINATION="platform=iOS Simulator,id=$simulator_id" bash ./scripts/ios-dev.sh test-destination)"
          echo "Resolved exact test target: $destination"
          {
            echo "IOS_TEST_DESTINATION=$destination"
            echo "IOS_DERIVED_DATA_PATH=$RUNNER_TEMP/ios-derived-data"
            echo "TAILCAT_MOBILE_TOOL_DIR=$RUNNER_TEMP/tailcat-mobile-tools"
          } >> "$GITHUB_ENV"
          # 在缓存恢复与编译期间提前冷启动 Simulator，缩短测试启动等待。
          xcrun simctl boot "$simulator_id" >/dev/null 2>&1 || true

      - name: Cache Tailcat XCFramework and tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ios/MimiRemote/Generated
            ${{ runner.temp }}/tailcat-mobile-tools
          key: tailcat-mobile-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.tailcat_key }}-${{ hashFiles('experiments/tailcat/go.mod', 'experiments/tailcat/go.sum', 'experiments/tailcat/**/*.go', 'experiments/tailcat/**/*.c', 'experiments/tailcat/**/*.h', 'experiments/tailcat/**/*.m', 'scripts/build-tailcat-mobile.sh') }}
          restore-keys: |
            tailcat-mobile-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.tailcat_key }}-

      - name: Cache Xcode SPM and DerivedData
        id: ios-derived-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/ios-derived-data
          key: ios-spm-derived-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.xcode_key }}-${{ hashFiles('ios/MimiRemote/MimiRemote.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Run image recovery UI regressions
        # 普通 XCTest 宿主没有可操作的 SwiftUI 元素树；这两项必须真实点击图片卡。
        # 仍通过统一入口持有固定 M5 租约，不连接真实 agentd 或读取用户文件。
        env:
          SCHEME: MimiRemotePhysicalUITests
        run: |
          bash ./scripts/ios-dev.sh test -quiet \
            -resultBundlePath "$RUNNER_TEMP/conversation-image-recovery.xcresult" \
            -collect-test-diagnostics never -testLanguage zh-Hans -testRegion CN \
            -only-testing:MimiRemoteUITests/ConversationImageRecoveryUITests
          xcrun xcresulttool get test-results summary \
            --path "$RUNNER_TEMP/conversation-image-recovery.xcresult" \
            > "$RUNNER_TEMP/conversation-image-recovery.json"
          python3 - "$RUNNER_TEMP/conversation-image-recovery.json" <<'PY'
          import json, sys
          result = json.load(open(sys.argv[1]))
          assert result["totalTestCount"] == result["passedTests"] == 2, result
          PY

      - name: Preserve image recovery UI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: conversation-image-recovery
          path: ${{ runner.temp }}/conversation-image-recovery.*
          if-no-files-found: ignore
          retention-days: 7

      - name: Prune DerivedData before cache save
        if: steps.ios-derived-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          rm -rf \
            "$IOS_DERIVED_DATA_PATH/Logs" \
            "$IOS_DERIVED_DATA_PATH/Index.noindex" \
            "$IOS_DERIVED_DATA_PATH/MimiBuildEvidence" \
            "$IOS_DERIVED_DATA_PATH"/*.xcresult

  tailcat-integration:
    name: Tailcat integration (Linux)
    # Tailcat 集成测试只依赖 127.0.0.1 上的 DERP/STUN fixture。hosted macOS 偶尔
    # 回连超时，所以完整运行放在 Linux，macOS job 只编译。发布路径上传的是已过
    # PR Gate 的 main，这里不再重跑，避免托管网络抖动让签名发布显示失败。
    if: >-
      !inputs.publish_internal_testflight &&
      !(github.event_name == 'workflow_dispatch' && inputs.publish_app_store)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Setup Go for Tailcat
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: experiments/tailcat/go.mod
          cache-dependency-path: experiments/tailcat/go.sum

      - name: Test Tailcat module
        working-directory: experiments/tailcat
        run: go test ./... -count=1

  conversation-regressions:
    # 使用稳定版 Xcode 26 / iOS 26 Simulator 运行回归；工程仍以 iOS 18 为 deployment target，
    # 因此编译阶段会检查所有 iOS 26+ API 是否具备有效 availability fallback。
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          clean: true

      - name: Setup Go for Tailcat
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: experiments/tailcat/go.mod
          cache-dependency-path: experiments/tailcat/go.sum

      - name: Show toolchain and resolve fixed CI simulator
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcode_version="$(xcodebuild -version)"
          printf '%s\n' "$xcode_version"
          xcrun simctl list devices available

          iphoneos_sdk="$(xcrun --sdk iphoneos --show-sdk-build-version)"
          simulator_sdk="$(xcrun --sdk iphonesimulator --show-sdk-build-version)"
          go_version="$(cd experiments/tailcat && go version && go env GOVERSION GOHOSTOS GOHOSTARCH)"
          tailcat_key="$(printf '%s\n%s\n%s\n' "$go_version" "$iphoneos_sdk" "$simulator_sdk" | shasum -a 256 | awk '{ print substr($1, 1, 16) }')"
          xcode_key="$(printf '%s\n%s\n' "$xcode_version" "$simulator_sdk" | shasum -a 256 | awk '{ print substr($1, 1, 16) }')"
          echo "tailcat_key=$tailcat_key" >> "$GITHUB_OUTPUT"
          echo "xcode_key=$xcode_key" >> "$GITHUB_OUTPUT"

          # iOS 26.5 的 StoreKitTest 配置同步失效（FB22500243），会误走 Apple 登录。
          # 使用 runner 已安装的 26.2；保留稳定 Xcode 编译和全部购买/退款断言。
          simulator_id="$(xcrun simctl list devices available -j | ruby -rjson -e '
            devices = JSON.parse(STDIN.read).fetch("devices").fetch("com.apple.CoreSimulator.SimRuntime.iOS-26-2", [])
            device = devices.find { |item| item["isAvailable"] && item["name"] == "iPad Pro 13-inch (M5)" }
            abort "Missing iPad Pro 13-inch (M5) on iOS 26.2" unless device
            puts device.fetch("udid")
          ')"
          destination="$(IOS_TEST_DESTINATION="platform=iOS Simulator,id=$simulator_id" bash ./scripts/ios-dev.sh test-destination)"
          echo "Resolved exact test target: $destination"
          {
            echo "IOS_TEST_DESTINATION=$destination"
            echo "IOS_DERIVED_DATA_PATH=$RUNNER_TEMP/ios-derived-data"
            echo "TAILCAT_MOBILE_TOOL_DIR=$RUNNER_TEMP/tailcat-mobile-tools"
          } >> "$GITHUB_ENV"
          # 在缓存恢复、前置静态检查与编译期间提前冷启动 Simulator，缩短测试启动等待。
          xcrun simctl boot "$simulator_id" >/dev/null 2>&1 || true

      - name: Cache Tailcat XCFramework and tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ios/MimiRemote/Generated
            ${{ runner.temp }}/tailcat-mobile-tools
          key: tailcat-mobile-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.tailcat_key }}-${{ hashFiles('experiments/tailcat/go.mod', 'experiments/tailcat/go.sum', 'experiments/tailcat/**/*.go', 'experiments/tailcat/**/*.c', 'experiments/tailcat/**/*.h', 'experiments/tailcat/**/*.m', 'scripts/build-tailcat-mobile.sh') }}
          restore-keys: |
            tailcat-mobile-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.tailcat_key }}-

      - name: Cache Xcode SPM and DerivedData
        id: ios-derived-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/ios-derived-data
          key: ios-spm-derived-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.xcode_key }}-${{ hashFiles('ios/MimiRemote/MimiRemote.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Run iOS preflight checks in parallel
        # 全部独立的前置脚本自检、deployment target 校验和静态策略按 3 核并行执行，
        # 保留每一项检查与完整失败日志，不再串行阻塞核心回归。
        shell: bash
        run: |
          set -euo pipefail
          log_dir="$RUNNER_TEMP/ios-preflight-logs"
          mkdir -p "$log_dir"

          lane_evidence() {
            echo "==> Check iOS build evidence reuse"
            bash ./scripts/test-ios-build-evidence.sh
          }

          lane_targets_and_device() {
            # 不继承主回归共享的 DerivedData/工具缓存路径：xcodebuild 在 -target/-alltargets
            # 模式下禁止传 -derivedDataPath，且设备管理自测需要按默认路径验证 UDID 隔离。
            unset IOS_DERIVED_DATA_PATH IOS_DEVICE_DERIVED_DATA_PATH TAILCAT_MOBILE_TOOL_DIR
            echo "==> Verify iOS 18 deployment target"
            for target_name in \
              MimiRemote \
              MimiCarStatusWidgetExtension \
              MimiNotificationServiceExtension \
              MimiRemoteTests \
              MimiRemoteUITests
            do
              deployment_targets="$(
                xcodebuild \
                  -project ios/MimiRemote/MimiRemote.xcodeproj \
                  -target "$target_name" \
                  -configuration Debug \
                  -showBuildSettings \
                  | awk '$1 == "IPHONEOS_DEPLOYMENT_TARGET" && $2 == "=" { print $3 }' \
                  | sort -u
              )"
              if [[ "$deployment_targets" != "18.0" ]]; then
                echo "$target_name expected iOS deployment target 18.0, got: $deployment_targets" >&2
                exit 1
              fi
            done
            echo "==> Check iOS device selection and leases"
            bash ./scripts/test-ios-device-management.sh
            echo "==> Check Tailcat mobile build cache"
            bash ./scripts/test-tailcat-mobile-build.sh
          }

          lane_tailcat_and_static() {
            echo "==> Compile Tailcat module tests"
            # Hosted macOS 偶尔无法在本地 DERP fixture 启动后 10 秒内回连；完整运行由
            # tailcat-integration（Linux）负责。真实 Go→XCFramework→iOS 链接仍由后续 iOS 构建覆盖。
            (cd experiments/tailcat && go test ./... -run '^$' -count=1)
            echo "==> Check physical-device GUI handoff"
            bash ./scripts/test-ios-device-gui-handoff-macos.sh
            echo "==> Check network security policy"
            bash ./scripts/check-ios-network-security.sh
            echo "==> Check privacy manifest"
            bash ./scripts/check-ios-privacy-manifest.sh
            echo "==> Test iOS localization check"
            bash ./scripts/test-check-ios-localization.sh
            echo "==> Check App Store metadata"
            bash ./scripts/check-app-store-metadata.sh
            echo "==> Check pinned asc CLI integration"
            bash ./scripts/test-ios-asc-cli.sh
            echo "==> Check source size"
            bash ./scripts/check-source-size.sh
            echo "==> Check iOS test selectors"
            # xcodebuild 对失效的类名或方法 selector 静默执行 0 个；先静态拦住，
            # 并要求每个测试类归属 PR 集合或每晚集合（#741）。
            bash ./scripts/test-ios-test-inventory.sh
            bash ./scripts/check-ios-test-selectors.sh
          }

          lane_evidence > "$log_dir/evidence.log" 2>&1 &
          pid_evidence=$!
          lane_targets_and_device > "$log_dir/targets-device.log" 2>&1 &
          pid_targets=$!
          lane_tailcat_and_static > "$log_dir/tailcat-static.log" 2>&1 &
          pid_static=$!

          status=0
          wait "$pid_evidence" || { status=1; echo "::error::iOS build evidence lane failed"; }
          wait "$pid_targets" || { status=1; echo "::error::iOS deployment targets / device / tailcat cache lane failed"; }
          wait "$pid_static" || { status=1; echo "::error::iOS Tailcat compile / static policy lane failed"; }

          for name in evidence targets-device tailcat-static; do
            echo "--- preflight lane: ${name} ---"
            cat "$log_dir/${name}.log"
          done
          exit "$status"

      - name: Check iOS localization
        run: bash ./scripts/check-ios-localization.sh

      - name: Run core regressions
        # 根模块 Go 与共享契约由独立 Go CI 覆盖；这里已单独验证 Tailcat module。
        # 只重录不匹配的快照，供下载后逐张核对再提交。重录本身仍让本步失败。
        env:
          TEST_RUNNER_SNAPSHOT_TESTING_RECORD: failed
        run: bash ./scripts/test-conversation-regressions.sh --ios-only

      - name: Collect rerecorded conversation snapshots
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/rerecorded-conversation-snapshots"
          mkdir -p "$dest"
          snapshot_dir="ios/MimiRemote/Tests/MimiRemoteTests/__Snapshots__"
          git status --porcelain -- "$snapshot_dir" > "$dest/status.txt" || true
          while IFS= read -r path; do
            [[ -n "$path" && -f "$path" && ! -L "$path" ]] || continue
            mkdir -p "$dest/$(dirname -- "$path")"
            cp -- "$path" "$dest/$path"
          done < <(git diff --name-only -- "$snapshot_dir")
          find "$dest" -type f | sort > "$dest/manifest.txt"

      - name: Upload rerecorded conversation snapshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rerecorded-conversation-snapshots
          path: ${{ runner.temp }}/rerecorded-conversation-snapshots
          if-no-files-found: ignore
          retention-days: 7

      # 日常核心回归已经覆盖 LocalizationTests；只有真正发布 TestFlight 时
      # 才额外启动一次英文系统环境，避免每个 PR/main 都承担第二次 Simulator 启动。
      - name: Run English localization smoke
        if: >-
          inputs.publish_internal_testflight ||
          (github.event_name == 'workflow_dispatch' && inputs.publish_app_store)
        run: bash ./scripts/test-ios-localization-smoke.sh

      - name: Prune DerivedData before cache save
        if: steps.ios-derived-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          rm -rf \
            "$IOS_DERIVED_DATA_PATH/Logs" \
            "$IOS_DERIVED_DATA_PATH/Index.noindex" \
            "$IOS_DERIVED_DATA_PATH/MimiBuildEvidence" \
            "$IOS_DERIVED_DATA_PATH"/*.xcresult

  app-store-release:
    needs:
      - conversation-regressions
      - image-recovery-ui-regressions
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.publish_app_store) ||
      inputs.publish_internal_testflight
    runs-on: macos-26
    timeout-minutes: 45
    environment: ios-testflight-release
    env:
      IOS_BUNDLE_ID: com.gaixianggeng.mimi
      IOS_WIDGET_BUNDLE_ID: com.gaixianggeng.mimi.carstatuswidget
      IOS_NOTIFICATION_BUNDLE_ID: com.gaixianggeng.mimi.notificationservice
      DEVELOPMENT_TEAM: 9HZ89R58PZ
      TESTFLIGHT_BETA_GROUP_ID: 26b7c973-b94f-46d5-b300-1c252fd6fdb1
      IOS_TESTFLIGHT_UPLOAD: >-
        ${{ ((github.event_name == 'workflow_dispatch' && inputs.publish_app_store) ||
          inputs.publish_internal_testflight) && '1' || '0' }}
      IOS_TESTFLIGHT_VALIDATE: "0"
      IOS_RELEASE_EXPECTED_MACOS_MAJOR: "26"
      IOS_RELEASE_EXPECTED_XCODE_VERSION: "26.6"
      IOS_RELEASE_EXPECTED_XCODE_BUILD: 17F113
      IOS_RELEASE_EXPECTED_SDK_VERSION: "26.5"
      IOS_RELEASE_EXPECTED_SDK_BUILD: 23F81a
      # 第一阶段只记录差异；Ruby 预检仍是实际构建号的唯一来源。
      IOS_ASC_BUILD_NUMBER_MODE: shadow
      TESTFLIGHT_WHATS_NEW: ${{ inputs.what_to_test }}
    steps:
      - name: Checkout clean release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
          clean: true

      - name: Setup Go for Tailcat
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: experiments/tailcat/go.mod
          cache-dependency-path: experiments/tailcat/go.sum

      # 所有签名材料都在后续 step 才注入；这里先锁定官方仓库当前 main
      # 的同一个 immutable commit，手工从其他分支触发会 fail closed。
      - name: Trust gate before App Store signing
        shell: bash
        env:
          CANDIDATE_SOURCE_REF: ${{ inputs.source_ref || github.sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "gaixianggeng/mimi-remote" ]] \
            || { echo "iOS TestFlight 只允许在官方仓库运行。" >&2; exit 1; }
          [[ "$GITHUB_REF" == "refs/heads/main" ]] \
            || { echo "iOS TestFlight 只允许从 refs/heads/main 运行。" >&2; exit 1; }
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "iOS TestFlight 需要 40 位 immutable event SHA。" >&2; exit 1; }
          [[ "$CANDIDATE_SOURCE_REF" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "iOS TestFlight source_ref 必须是 40 位 commit SHA。" >&2; exit 1; }
          head_sha="$(git rev-parse HEAD)"
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          [[ "$head_sha" == "$GITHUB_SHA" &&
            "$GITHUB_SHA" == "$CANDIDATE_SOURCE_REF" &&
            "$main_sha" == "$CANDIDATE_SOURCE_REF" ]] \
            || {
              echo "iOS TestFlight source 不是当前 origin/main：head=$head_sha event=$GITHUB_SHA source=$CANDIDATE_SOURCE_REF main=$main_sha" >&2
              exit 1
            }

      - name: Select exact stable Xcode
        shell: bash
        run: |
          set -euo pipefail
          selected_developer_dir=""
          for app in /Applications/Xcode*.app; do
            [[ -d "$app/Contents/Developer" ]] || continue
            version="$(
              DEVELOPER_DIR="$app/Contents/Developer" xcodebuild -version
            )"
            if [[ "$version" == $'Xcode 26.6\nBuild version 17F113' ]]; then
              selected_developer_dir="$app/Contents/Developer"
              break
            fi
          done
          [[ -n "$selected_developer_dir" ]] || {
            echo "Xcode 26.6 (17F113) is not installed on this runner." >&2
            find /Applications -maxdepth 1 -name 'Xcode*.app' -print >&2
            exit 1
          }
          echo "DEVELOPER_DIR=$selected_developer_dir" >> "$GITHUB_ENV"

      - name: Verify stable host and SDK
        id: release-toolchain
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-build-version
          [[ "$(sw_vers -productVersion)" == 26.* ]]
          [[ "$(xcodebuild -version)" == $'Xcode 26.6\nBuild version 17F113' ]]
          [[ "$(xcrun --sdk iphoneos --show-sdk-version)" == "26.5" ]]
          [[ "$(xcrun --sdk iphoneos --show-sdk-build-version)" == "23F81a" ]]
          iphoneos_sdk="$(xcrun --sdk iphoneos --show-sdk-build-version)"
          simulator_sdk="$(xcrun --sdk iphonesimulator --show-sdk-build-version)"
          go_version="$(cd experiments/tailcat && go version && go env GOVERSION GOHOSTOS GOHOSTARCH)"
          tailcat_key="$(printf '%s\n%s\n%s\n' "$go_version" "$iphoneos_sdk" "$simulator_sdk" | shasum -a 256 | awk '{ print substr($1, 1, 16) }')"
          echo "tailcat_key=$tailcat_key" >> "$GITHUB_OUTPUT"
          echo "TAILCAT_MOBILE_TOOL_DIR=$RUNNER_TEMP/tailcat-mobile-tools" >> "$GITHUB_ENV"

      - name: Cache Tailcat XCFramework and tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ios/MimiRemote/Generated
            ${{ runner.temp }}/tailcat-mobile-tools
          key: tailcat-mobile-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.release-toolchain.outputs.tailcat_key }}-${{ hashFiles('experiments/tailcat/go.mod', 'experiments/tailcat/go.sum', 'experiments/tailcat/**/*.go', 'experiments/tailcat/**/*.c', 'experiments/tailcat/**/*.h', 'experiments/tailcat/**/*.m', 'scripts/build-tailcat-mobile.sh') }}
          restore-keys: |
            tailcat-mobile-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.release-toolchain.outputs.tailcat_key }}-

      - name: Prepare pinned asc CLI shadow tool
        shell: bash
        run: |
          set -euo pipefail
          asc_bin="$RUNNER_TEMP/mimi-release-tools/asc"
          echo "ASC_CLI_BIN=$asc_bin" >> "$GITHUB_ENV"
          if ! bash ./scripts/ios_asc_cli.sh install --destination "$asc_bin"; then
            echo "::warning::固定版本 asc 安装或校验失败；本次发布保留 Ruby 预检并记录 shadow error。"
          fi

      - name: Prepare App Store signing
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          IOS_APPSTORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROVISIONING_PROFILE_BASE64 }}
          IOS_WIDGET_APPSTORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_APPSTORE_PROVISIONING_PROFILE_BASE64 }}
          IOS_NOTIFICATION_APPSTORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_NOTIFICATION_APPSTORE_PROVISIONING_PROFILE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          for secret_name in \
            ASC_KEY_ID \
            ASC_ISSUER_ID \
            ASC_PRIVATE_KEY \
            IOS_APPSTORE_PROVISIONING_PROFILE_BASE64 \
            IOS_WIDGET_APPSTORE_PROVISIONING_PROFILE_BASE64 \
            IOS_NOTIFICATION_APPSTORE_PROVISIONING_PROFILE_BASE64 \
            IOS_DISTRIBUTION_CERTIFICATE_BASE64 \
            IOS_DISTRIBUTION_CERTIFICATE_PASSWORD \
            IOS_KEYCHAIN_PASSWORD; do
            [[ -n "${!secret_name}" ]] || {
              echo "Required GitHub Actions secret is empty: $secret_name" >&2
              exit 1
            }
          done

          release_secrets="$RUNNER_TEMP/ios-release-secrets"
          mkdir -p "$release_secrets"
          chmod 700 "$release_secrets"

          api_key="$release_secrets/AuthKey_${ASC_KEY_ID}.p8"
          certificate="$release_secrets/distribution.p12"
          profile="$release_secrets/app-store.mobileprovision"
          profile_plist="$release_secrets/profile.plist"
          widget_profile="$release_secrets/widget-app-store.mobileprovision"
          widget_profile_plist="$release_secrets/widget-profile.plist"
          notification_profile="$release_secrets/notification-app-store.mobileprovision"
          notification_profile_plist="$release_secrets/notification-profile.plist"
          keychain="$release_secrets/signing.keychain-db"

          printf '%s' "$ASC_PRIVATE_KEY" > "$api_key"
          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          printf '%s' "$IOS_APPSTORE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile"
          printf '%s' "$IOS_WIDGET_APPSTORE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$widget_profile"
          printf '%s' "$IOS_NOTIFICATION_APPSTORE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$notification_profile"
          chmod 600 "$api_key" "$certificate" "$profile" "$widget_profile" "$notification_profile"

          security cms -D -i "$profile" > "$profile_plist"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist")"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")"
          profile_team="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$profile_plist")"
          profile_app_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile_plist")"
          profile_expiration="$(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$profile_plist")"
          profile_app_groups="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups' "$profile_plist")"
          [[ "$profile_team" == "$DEVELOPMENT_TEAM" ]]
          [[ "$profile_app_id" == "$DEVELOPMENT_TEAM.$IOS_BUNDLE_ID" ]]
          [[ "$profile_app_groups" == *"group.com.gaixianggeng.mimi"* ]]
          ruby -rtime -e 'exit(Time.parse(ARGV.fetch(0)) > Time.now ? 0 : 1)' "$profile_expiration"

          security cms -D -i "$widget_profile" > "$widget_profile_plist"
          widget_profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$widget_profile_plist")"
          widget_profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$widget_profile_plist")"
          widget_profile_team="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$widget_profile_plist")"
          widget_profile_app_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$widget_profile_plist")"
          widget_profile_expiration="$(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$widget_profile_plist")"
          widget_profile_app_groups="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups' "$widget_profile_plist")"
          [[ "$widget_profile_team" == "$DEVELOPMENT_TEAM" ]]
          [[ "$widget_profile_app_id" == "$DEVELOPMENT_TEAM.$IOS_WIDGET_BUNDLE_ID" ]]
          [[ "$widget_profile_app_groups" == *"group.com.gaixianggeng.mimi"* ]]
          ruby -rtime -e 'exit(Time.parse(ARGV.fetch(0)) > Time.now ? 0 : 1)' "$widget_profile_expiration"

          # 通知扩展（#418）在设备上用 App Group 缓存改写锁屏标题，profile 同样必须带 App Group。
          security cms -D -i "$notification_profile" > "$notification_profile_plist"
          notification_profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$notification_profile_plist")"
          notification_profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$notification_profile_plist")"
          notification_profile_team="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$notification_profile_plist")"
          notification_profile_app_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$notification_profile_plist")"
          notification_profile_expiration="$(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$notification_profile_plist")"
          notification_profile_app_groups="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups' "$notification_profile_plist")"
          [[ "$notification_profile_team" == "$DEVELOPMENT_TEAM" ]]
          [[ "$notification_profile_app_id" == "$DEVELOPMENT_TEAM.$IOS_NOTIFICATION_BUNDLE_ID" ]]
          [[ "$notification_profile_app_groups" == *"group.com.gaixianggeng.mimi"* ]]
          ruby -rtime -e 'exit(Time.parse(ARGV.fetch(0)) > Time.now ? 0 : 1)' "$notification_profile_expiration"

          profiles_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles_dir"
          cp "$profile" "$profiles_dir/$profile_uuid.mobileprovision"
          cp "$widget_profile" "$profiles_dir/$widget_profile_uuid.mobileprovision"
          cp "$notification_profile" "$profiles_dir/$notification_profile_uuid.mobileprovision"

          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" \
            -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$IOS_KEYCHAIN_PASSWORD" \
            "$keychain"
          original_keychains=()
          while IFS= read -r existing_keychain; do
            [[ -n "$existing_keychain" ]] && original_keychains+=("$existing_keychain")
          done < <(
            security list-keychains -d user \
              | sed -E 's/^[[:space:]]*"([^"]+)"[[:space:]]*$/\1/'
          )
          security list-keychains -d user -s "$keychain" "${original_keychains[@]}"

          signing_identity="$(
            security find-identity -v -p codesigning "$keychain" \
              | sed -nE 's/.*"((Apple|iPhone) Distribution:[^"]+)".*/\1/p' \
              | head -n 1
          )"
          [[ -n "$signing_identity" && "$signing_identity" == *"($DEVELOPMENT_TEAM)" ]]

          {
            echo "APP_STORE_CONNECT_API_KEY_ID=$ASC_KEY_ID"
            echo "APP_STORE_CONNECT_API_ISSUER_ID=$ASC_ISSUER_ID"
            echo "APP_STORE_CONNECT_API_KEY_PATH=$api_key"
            echo "IOS_SIGNING_KEYCHAIN_PATH=$keychain"
            echo "IOS_PROVISIONING_PROFILE_SPECIFIER<<__PROFILE__"
            echo "$profile_name"
            echo "__PROFILE__"
            echo "IOS_WIDGET_PROVISIONING_PROFILE_SPECIFIER<<__WIDGET_PROFILE__"
            echo "$widget_profile_name"
            echo "__WIDGET_PROFILE__"
            echo "IOS_NOTIFICATION_PROVISIONING_PROFILE_SPECIFIER<<__NOTIFICATION_PROFILE__"
            echo "$notification_profile_name"
            echo "__NOTIFICATION_PROFILE__"
            echo "IOS_CODE_SIGN_IDENTITY<<__IDENTITY__"
            echo "$signing_identity"
            echo "__IDENTITY__"
          } >> "$GITHUB_ENV"

      - name: Archive, audit, upload, and distribute build
        shell: bash
        run: bash ./scripts/ios_testflight_ci.sh

      - name: Write Nightly TestFlight evidence
        if: inputs.publish_internal_testflight
        shell: bash
        env:
          EVIDENCE_SHA: ${{ inputs.source_ref || github.sha }}
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/mimi-testflight-evidence"
          mkdir -p "$evidence_dir"
          EVIDENCE_PATH="$evidence_dir/evidence.json" \
            ruby -rtime -rjson -e '
              path = ENV.fetch("EVIDENCE_PATH")
              payload = {
                source_sha: ENV.fetch("EVIDENCE_SHA"),
                run_id: ENV.fetch("GITHUB_RUN_ID"),
                run_attempt: ENV.fetch("GITHUB_RUN_ATTEMPT", "1"),
                repository: ENV.fetch("GITHUB_REPOSITORY"),
                workflow: ENV.fetch("GITHUB_WORKFLOW"),
                event: ENV.fetch("GITHUB_EVENT_NAME"),
                uploaded: true,
                uploaded_at_utc: Time.now.utc.iso8601
              }
              File.write(path, JSON.pretty_generate(payload) + "\n")
            '
          ruby -rjson -e '
            value = JSON.parse(File.read(ARGV.fetch(0)))
            abort "Nightly evidence uploaded 必须为 true" unless value["uploaded"] == true
            abort "Nightly evidence source_sha 不完整" unless value["source_sha"].match?(/\A[0-9a-f]{40}\z/)
          ' "$evidence_dir/evidence.json"

      - name: Upload Nightly TestFlight evidence
        if: inputs.publish_internal_testflight
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-testflight-${{ inputs.source_ref || github.sha }}
          path: ${{ runner.temp }}/mimi-testflight-evidence/evidence.json
          if-no-files-found: error
          retention-days: 30
