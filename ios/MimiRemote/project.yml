name: MimiRemote
options:
  bundleIdPrefix: com.gaixianggeng
  # 与当前工程的 Xcode 27 元数据保持一致，避免每次 XcodeGen 把 scheme 降级到旧版本。
  xcodeVersion: "27.0"
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 9HZ89R58PZ
    # iOS 18–25 走普通材质与功能降级；iOS 26+ 继续启用 Liquid Glass 和新 Speech API。
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SDKROOT: auto
packages:
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: "1.17.0"
  swift-markdown:
    url: https://github.com/swiftlang/swift-markdown
    from: "0.8.0"
fileGroups:
  - Resources/MimiRemote.storekit
targets:
  MimiRemote:
    type: application
    platform: auto
    supportedDestinations:
      - iOS
      - macCatalyst
    sources:
      - path: Sources
        # 本机 Agent 配置目录不属于 App 源码；排除后避免 XcodeGen 每次为
        # 空 `.claude` 目录生成随机 TEMP group，造成不可复现的工程文件 diff。
        excludes:
          - "**/.claude"
          - "**/.claude/**"
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      - path: Resources/en.lproj/InfoPlist.strings
        buildPhase: resources
      - path: Resources/zh-Hans.lproj/InfoPlist.strings
        buildPhase: resources
      - path: ../../docs/privacy-policy.md
        group: Resources
        buildPhase: resources
      - path: ../../docs/terms-of-use.md
        group: Resources
        buildPhase: resources
      - path: ../../docs/support.md
        group: Resources
        buildPhase: resources
      - path: ../../LICENSE
        group: Resources
        buildPhase: resources
      - path: ../../THIRD_PARTY_NOTICES.md
        group: Resources
        buildPhase: resources
    preBuildScripts:
      - name: Build Tailcat iOS framework
        script: |
          case "${PLATFORM_NAME:-}" in
            iphoneos|iphonesimulator)
              export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/local/go/bin:$PATH"
              export GOTOOLCHAIN="${GOTOOLCHAIN:-auto}"
              bash "$SRCROOT/../../scripts/build-tailcat-mobile.sh"
              ;;
          esac
        basedOnDependencyAnalysis: false
    dependencies:
      - package: swift-markdown
        product: Markdown
      - target: MimiCarStatusWidgetExtension
        embed: true
        destinationFilters:
          - iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gaixianggeng.mimi
        PRODUCT_NAME: MimiRemote
        PRODUCT_MODULE_NAME: MimiRemote
        INFOPLIST_FILE: Resources/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Sources/MimiRemote-Bridging-Header.h
        "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]": "$(inherited) $(PROJECT_DIR)/Generated/TailcatMobile.xcframework/ios-arm64"
        "FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]": "$(inherited) $(PROJECT_DIR)/Generated/TailcatMobile.xcframework/ios-arm64_x86_64-simulator"
        "GCC_PREPROCESSOR_DEFINITIONS[sdk=iphoneos*]": "$(inherited) MIMI_REQUIRE_TAILCAT=1"
        "GCC_PREPROCESSOR_DEFINITIONS[sdk=iphonesimulator*]": "$(inherited) MIMI_REQUIRE_TAILCAT=1"
        # Tailcat 首次构建会写入源码树下的 Generated 与仓库级工具缓存。
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": Resources/MimiRemote.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Resources/MimiRemote.entitlements
        "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": "$(IOS_PROVISIONING_PROFILE_SPECIFIER)"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        "INFOPLIST_FILE[sdk=macosx*]": Resources/Info-Catalyst.plist
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Resources/MimiRemote-Catalyst.entitlements
        "ASSETCATALOG_COMPILER_APPICON_NAME[sdk=macosx*]": AppIconMac
        SDKROOT: auto
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "YES"
        SUPPORTS_MACCATALYST_OPTIMIZED_FOR_MAC: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: "NO"
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": "YES"
        # UI 文案统一由显式 L10n key 管理，关闭编译器自动提取，避免 Xcode 把技术字符串写回目录。
        SWIFT_EMIT_LOC_STRINGS: "NO"
        # 1.2 已通过审核；本次仅更新商店名称与截图，使用 1.2.1 通道。
        CURRENT_PROJECT_VERSION: "100098"
        MARKETING_VERSION: "1.2.1"
  MimiCarStatusWidgetExtension:
    type: app-extension
    platform: iOS
    productName: MimiCarStatusWidget
    sources:
      - path: WidgetExtension
        excludes:
          - "*.entitlements"
          - Info.plist
      - path: Sources/Core/CarStatus/CarStatusSnapshot.swift
        group: Sources/Core/CarStatus
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gaixianggeng.mimi.carstatuswidget
        PRODUCT_NAME: MimiCarStatusWidget
        INFOPLIST_FILE: WidgetExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: WidgetExtension/MimiCarStatusWidget.entitlements
        APPLICATION_EXTENSION_API_ONLY: "YES"
        "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": "$(IOS_WIDGET_PROVISIONING_PROFILE_SPECIFIER)"
        SKIP_INSTALL: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
        CURRENT_PROJECT_VERSION: "100098"
        MARKETING_VERSION: "1.2.1"
        SWIFT_EMIT_LOC_STRINGS: "NO"
  MimiRemoteTests:
    type: bundle.unit-test
    platform: auto
    supportedDestinations:
      - iOS
      - macCatalyst
    sources:
      - path: Tests
        excludes:
          - MimiRemoteTests/ConversationSnapshotTests.swift
          - MimiRemoteTests/SettingsChoiceRowSnapshotTests.swift
          - MimiRemoteTests/SettingsConnectionCardSnapshotTests.swift
          - MimiRemoteTests/ConnectionSettingsSnapshotTests.swift
          - MimiRemoteTests/SkillModelPickerSnapshotTests.swift
          - MimiRemoteTests/TokenUsageCardSnapshotTests.swift
          - MimiRemoteTests/WorkspaceVisualSnapshotTests.swift
          # UI 测试只能由 MimiRemoteUITests Target 承载；否则普通单测会在没有
          # XCUIApplication 配置的环境里启动并崩溃。
          - MimiRemoteUITests
          - MimiRemoteUITests/**
      - path: Tests/MimiRemoteTests/ConversationSnapshotTests.swift
        destinationFilters:
          - iOS
      - path: Tests/MimiRemoteTests/SkillModelPickerSnapshotTests.swift
        destinationFilters:
          - iOS
      - path: Tests/MimiRemoteTests/SettingsChoiceRowSnapshotTests.swift
        destinationFilters:
          - iOS
      - path: Tests/MimiRemoteTests/ConnectionSettingsSnapshotTests.swift
        destinationFilters:
          - iOS
      - path: Tests/MimiRemoteTests/SettingsConnectionCardSnapshotTests.swift
        destinationFilters:
          - iOS
      - path: Tests/MimiRemoteTests/TokenUsageCardSnapshotTests.swift
        destinationFilters:
          - iOS
      - path: Tests/MimiRemoteTests/WorkspaceVisualSnapshotTests.swift
        destinationFilters:
          - iOS
      - path: Resources/MimiRemote.storekit
        buildPhase: resources
    dependencies:
      - target: MimiRemote
      - package: SnapshotTesting
        destinationFilters:
          - iOS
        product: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gaixianggeng.mimiTests
        SDKROOT: auto
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "YES"
        SUPPORTS_MACCATALYST_OPTIMIZED_FOR_MAC: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MimiRemote.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/MimiRemote"
        BUNDLE_LOADER: "$(TEST_HOST)"
  MimiRemoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/MimiRemoteUITests
    dependencies:
      - target: MimiRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gaixianggeng.mimiUITests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: MimiRemote
schemes:
  MimiRemote:
    build:
      targets:
        MimiRemote: all
        MimiRemoteTests:
          - test
    run:
      storeKitConfiguration: Resources/MimiRemote.storekit
    test:
      language: zh-Hans
      targets:
        - MimiRemoteTests
  MimiRemotePhysicalUITests:
    build:
      targets:
        MimiRemote: all
        MimiRemoteUITests:
          - test
    test:
      targets:
        - MimiRemoteUITests
      basedOnDependencyAnalysis: false
